[project]
name = "chess-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "asyncpg>=0.29",
    "redis[asyncio]>=5.0",
    "supabase>=2.0",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "stripe>=10.0",
    "celery[redis]>=5.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
